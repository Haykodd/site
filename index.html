/* motion */
@property --p{syntax:"<number>";inherits:true;initial-value:50}
/* trade bar: a tug-of-war meter. Both sides fill by share, a slanted clash line rides the boundary with a spring. Only transforms move. */
.bal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 8px;align-items:end}
.bal .s.give{grid-area:1/1}.bal .s.get{grid-area:1/2}
.vs{--h:26px;--sl:calc(var(--h)*.49);--vsc:var(--ac);grid-area:2/1/3/3;position:relative;height:var(--h);margin:8px 0 4px;transition:--p .95s cubic-bezier(.34,1.45,.5,1)}
.vs[data-state="ok"]{--vsc:var(--get)}.vs[data-state="bad"]{--vsc:var(--give)}.vs[data-state="eq"]{--vsc:var(--gold)}.vs[data-state="empty"]{--vsc:var(--mu);animation:vsidle 3.4s ease-in-out infinite}

.vs-fill{position:absolute;inset:0;background:var(--give);clip-path:polygon(0 0,100% 0,calc(100% - var(--sl)) 100%,0 100%);transform:translateX(calc((var(--p) - 100)*1% + var(--sl)/2))}
.vs-fill::before{content:"";position:absolute;inset:0 -16px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.24) 0 7px,transparent 7px 14px);animation:vsflowr 1.2s linear infinite}
@keyframes vsflowr{to{transform:translateX(15.45px)}}
@keyframes vsflowl{to{transform:translateX(-15.45px)}}

if(a==="sxc"){sfx("pick");STX.d=+t.dataset.d;STX.s=+t.dataset.s;STX.r=+t.dataset.r;sxUpd();$("sxb").scrollIntoView({block:"center",behavior:"smooth"});return}
  if(a==="tab"){sfx("tick");TAB=t.dataset.t;lsSet("aa_tab",TAB);render();return}
if(a==="f"){sfx("tick");F=t.dataset.f;fbar();renderValueList(true);if(VIEW==="map")mpOpen(true);return}
if(a==="swap"){sfx("swap");[side.a,side.b]=[side.b,side.a];render();return}
if(a==="clr"){sfx("sweep");side.a=[];side.b=[];render();return}

if(a==="dl"){sfx("rm");H.splice(+t.dataset.j,1);lsSet("aa_hist",JSON.stringify(H));hist();return}
if(a==="ld"){sfx("load");const h=H[+t.dataset.j];side.a=un(h.a);side.b=un(h.b);render();window.scrollTo(0,0);return}
if(a==="addg"||a==="addr"){const k=a==="addg"?"a":"b";sfx("add");side[k].push({i:+t.dataset.i,q:1,s:VIEW==="map"&&mpStats()&&ALL[+t.dataset.i].u?{DMG:STX.d,SPA:STX.s,RNG:STX.r}:{DMG:0,SPA:0,RNG:0},o:0,n:1});render();fly(t,k==="a"?"var(--give)":"var(--get)");flash(t,"✓");return}
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(a==="x"){sfx("rm");const row=t.closest(".row");if(row&&!row.classList.contains("out")){row.classList.add("out");const k=t.dataset.k;setTimeout(()=>{const i=side[k].indexOf(r);if(i>=0)side[k].splice(i,1);render()},190)}return}
sfx(a==="p"?"up":a==="m"?"down":"tick");if(a==="m")r.q=Math.max(1,r.q-1);else if(a==="p")r.q++;else if(a==="t")r.o=!r.o;else if(a==="x")side[t.dataset.k].splice(+t.dataset.j,1);
render()});
document.addEventListener("change",e=>{const t=e.target;
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(t.dataset.a==="q")r.q=Math.max(1,parseInt(t.value)||1);else if(t.dataset.s)r.s[t.dataset.s]=+t.value;
render()});
for(const k of["a","b"]){const inp=$("s"+k),dd=$("d"+k);
const list=()=>{const q=inp.value.trim().toLowerCase();return ALL.map((x,i)=>i).filter(i=>match(ALL[i])&&(!q||ALL[i].n.toLowerCase().includes(q)))};
const show=()=>{dd.innerHTML=list().map(i=>`<div data-i="${i}">${tag(ALL[i])}<span class="dn">${esc(ALL[i].n)}<br><span class="mu">${tr("dem")} ${ALL[i].d}</span></span><b>${ALL[i].v<0?"?":fmt(ALL[i].v)}</b></div>`).join("")||`<div class="mu">${tr("none")}</div>`;dd.style.display="block"};
const add=i=>{sfx("add");side[k].push({i,q:1,s:{DMG:0,SPA:0,RNG:0},o:0,n:1});inp.value="";dd.style.display="none";if(matchMedia("(max-width:700px)").matches)inp.blur();render()};
inp.addEventListener("input",show);inp.addEventListener("focus",show);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=list();if(m.length)add(m[0])}});
inp.addEventListener("blur",()=>{dd.style.display="none"});
dd.addEventListener("mousedown",e=>e.preventDefault());
dd.addEventListener("click",e=>{const el=e.target.closest("[data-i]");if(el)add(+el.dataset.i)})}
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches("input")&&e.target.closest("#view-calc"))document.body.classList.add("typing")});
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches("input")&&a.closest("#view-calc")))document.body.classList.remove("typing")},60));

[["sw","swap"],["sv","save"],["cp","copy"],["rs","reset"]].forEach(([i,k])=>$(i).setAttribute("aria-label",tr(k)));

csFill($("srt"),sortOpts(),SORT,tr("sort_lbl"));
fbar();rgText();sndUI();tbText();mpText();newsText();tolUI();preText();preList();render();hist();renderValueList(true)}

{const l=lsGet("aa_lang",null);setLang(T[l]?l:dl());updateView(VIEW);setTimeout(upMaybe,500)}
