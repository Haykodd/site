<!doctype html>
<html lang="en" data-skin="cyan">
<head>
<meta charset="utf-8">
<title>AA Value Calculator: temporarily closed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14;--pop:#0d1426;--tx:#e8eefc;--mu:#8e9bc2;--on:#04101a;--ac:#29e1ff;--vi:#b06cff;--gold:#ffc94a;
--b1:16,23,43;--line:120,190,255;--ac-rgb:41,225,255;--vi-rgb:176,108,255;--gold-rgb:255,201,74;
--fd:"Chakra Petch",Onest,system-ui,sans-serif;--fb:Figtree,Onest,system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--fb);display:grid;grid-template-rows:auto 1fr;
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow-x:hidden}
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.2;will-change:transform}
.aura i:nth-child(1){left:-22vmax;top:-28vmax;background:radial-gradient(circle,var(--ac),transparent 62%);animation:d1 26s ease-in-out infinite alternate}
.aura i:nth-child(2){right:-26vmax;bottom:-30vmax;background:radial-gradient(circle,var(--vi),transparent 62%);animation:d2 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(6vmax,5vmax)}}
@keyframes d2{to{transform:translate(-5vmax,-6vmax)}}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
background-image:linear-gradient(rgba(var(--line),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--line),.06) 1px,transparent 1px);background-size:44px 44px;
-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
header{display:flex;justify-content:flex-end;padding:16px 18px}
.lng{display:flex;gap:4px}
.lng button{font:600 13px var(--fb);color:var(--mu);background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.lng button:hover{color:var(--tx)}
.lng button[aria-pressed="true"]{color:var(--ac);border-color:rgba(var(--ac-rgb),.55);background:rgba(var(--ac-rgb),.08)}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
main{display:grid;place-items:center;padding:8px 18px 56px}
.card{width:min(520px,100%);text-align:center;padding:44px 32px 36px;border-radius:26px;
background:linear-gradient(180deg,rgba(var(--b1),.92),rgba(10,15,30,.94));
border:1px solid rgba(var(--line),.22);
box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(var(--ac-rgb),.10)}
.mk{width:68px;height:68px;margin:0 auto 22px;display:grid;place-items:center;border-radius:20px;color:var(--ac);
background:rgba(var(--ac-rgb),.08);border:1px solid rgba(var(--ac-rgb),.55);box-shadow:0 0 28px rgba(var(--ac-rgb),.35),inset 0 0 18px rgba(var(--ac-rgb),.12)}
.mk svg{width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 12.5px var(--fb);color:var(--gold);border:1px solid rgba(var(--gold-rgb),.5);background:rgba(var(--gold-rgb),.08);padding:5px 13px;border-radius:999px;margin-bottom:16px}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--gold);display:block}
h1{margin:0 0 14px;font:700 clamp(30px,7vw,46px)/1.08 var(--fd);letter-spacing:.01em}
.lead{margin:0 auto;max-width:34ch;font-size:17px;color:var(--tx)}
.note{margin:18px auto 0;max-width:38ch;font-size:14px;color:var(--mu)}
.when{margin:20px 0 0;font:600 14px var(--fb);color:var(--ac)}
.btn{display:inline-block;margin-top:24px;padding:13px 26px;border-radius:14px;text-decoration:none;font:700 15px var(--fb);color:var(--on);
background:linear-gradient(135deg,var(--ac),var(--vi));box-shadow:0 8px 28px rgba(var(--ac-rgb),.28);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(var(--ac-rgb),.4)}
[hidden]{display:none!important}
@media(max-width:520px){.card{padding:34px 20px 28px;border-radius:22px}.lead{font-size:16px}}
@media(prefers-reduced-motion:reduce){.aura i{animation:none}.btn,.lng button{transition:none}}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i></div><div class="grid" aria-hidden="true"></div>
<header><nav class="lng" aria-label="Language">
  <button type="button" data-l="en">EN</button><button type="button" data-l="ru">RU</button><button type="button" data-l="uk">UK</button>
</nav></header>
<main>
  <section class="card" aria-labelledby="t">
    <div class="mk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M4 8l8-2 8 2M4 8l-2 6a3 3 0 0 0 4 0zM20 8l-2 6a3 3 0 0 0 4 0z"/></svg></div>
    <div class="chip"><b></b><span id="chip"></span></div>
    <h1 id="t"></h1>
    <p class="lead" id="lead"></p>
    <p class="note" id="note"></p>
    <p class="when" id="when" hidden></p>
    <a class="btn" id="contact" target="_blank" rel="noopener" hidden></a>
  </section>
</main>
<script>
/* ---- settings: edit these two lines if you want ---- */
const CLOSED={
  reopen:"",   /* optional, e.g. "2026-12-01" -> shows "Expected to reopen: 1 December 2026" */
  contact:""   /* optional link, e.g. your Discord invite -> shows a "Contact us" button */
};

const T={
 en:{title:"AA Value Calculator: temporarily closed",chip:"Closed",h:"Temporarily closed",lead:"AA Value Calculator is closed for now. Please check back later.",note:"Your saved trades and settings stay on this device.",when:"Expected to reopen: {d}",contact:"Contact us"},
 ru:{title:"AA Value Calculator: временно закрыт",chip:"Закрыто",h:"Сайт временно закрыт",lead:"AA Value Calculator сейчас закрыт. Загляните позже.",note:"Ваши сохранённые трейды и настройки остаются на вашем устройстве.",when:"Ожидаем открытие: {d}",contact:"Связаться с нами"},
 uk:{title:"AA Value Calculator: тимчасово закритий",chip:"Закрито",h:"Сайт тимчасово закритий",lead:"AA Value Calculator зараз закритий. Загляньте пізніше.",note:"Ваші збережені трейди й налаштування залишаються на вашому пристрої.",when:"Очікуємо відкриття: {d}",contact:"Зв’язатися з нами"}
};
const LOC={en:"en-GB",ru:"ru-RU",uk:"uk-UA"};
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const detect=()=>{for(const x of(navigator.languages||[navigator.language])){const c=(x||"").slice(0,2).toLowerCase();if(T[c])return c}return"en"};

function apply(l){
  const t=T[l];document.documentElement.lang=l;document.title=t.title;
  $("chip").textContent=t.chip;$("t").textContent=t.h;$("lead").textContent=t.lead;$("note").textContent=t.note;
  document.querySelectorAll(".lng button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  const d=CLOSED.reopen&&new Date(CLOSED.reopen+"T12:00:00");
  if(d&&!isNaN(d)){$("when").textContent=t.when.replace("{d}",d.toLocaleDateString(LOC[l],{day:"numeric",month:"long",year:"numeric"}));$("when").hidden=false}
  if(CLOSED.contact&&/^https?:\/\//i.test(CLOSED.contact)){$("contact").href=CLOSED.contact;$("contact").textContent=t.contact;$("contact").hidden=false}
}
document.querySelector(".lng").addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(!b)return;set("aa_lang",b.dataset.l);apply(b.dataset.l)});
{const s=get("aa_lang");apply(T[s]?s:detect())}
</script>
</body>
</html>
