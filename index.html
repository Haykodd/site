        const items = s.split("\n").map(l=>{
            const [n,v,d,t,inf]=l.split(";");
            return {n,v:+v,d:+d,t:t||"",inf:inf||"",c,u};
        }).filter(i => match(i) && (!q || i.n.toLowerCase().includes(q) || i.c.toLowerCase().includes(q)));
        
        if(items.length>0){
            html+=`<div class="tier-group" style="animation-delay:${delayCounter*0.03}s"><h2>${cat(c)}</h2><div class="list-grid">`;
            items.forEach(i=>{
                html+=`<div class="list-item" style="--tc:${TC(i)}; animation-delay:${delayCounter*0.015}s">
                    <div class="top">${tag(i)}<div class="nm">${esc(i.n)}<div class="meta">${chips(i)}</div>${i.inf?`<div class="mu">${esc(i.inf)}</div>`:""}</div></div>
                    <div class="pr">${i.v<0?"?":fmt(i.v)}</div>
                </div>`;
                delayCounter++;
            });
            html+=`</div></div>`;
        }
    });
    $("list-content").innerHTML = html||`<div class="empty">${tr("none")}</div>`;
}
$("list-q").addEventListener("input", renderValueList);

function render(){
for(const k of["a","b"])$("l"+k).innerHTML=side[k].map((r,j)=>{const i=ALL[r.i],s=sx(r),at=`data-k="${k}" data-j="${j}"`;
return `<div class="row" style="--tc:${TC(i)}"><div class="top">${tag(i)}<div class="nm">${esc(i.n)}<div class="meta">${chips(i)}</div>${i.inf?`<div class="mu">${esc(i.inf)}</div>`:""}</div><div class="pr">${fmt(price(r))}</div></div><div class="ctl"><span class="stp"><button ${at} data-a="m">−</button><input type="number" min="1" inputmode="numeric" value="${r.q}" ${at} data-a="q"><button ${at} data-a="p">+</button></span>${i.u?`<button class="btn g" ${at} data-a="t">${tr("stats")}${s?" +"+fmt(s):""} ${r.o?"▴":"▾"}</button>`:""}<button class="x" ${at} data-a="x">×</button></div>${i.u&&r.o?`<div class="ctl sg">${Object.keys(ST).map(n=>`<label class="mu">${n} <select ${at} data-s="${n}">${SL.map((o,x)=>`<option value="${x}"${r.s[n]==x?" selected":""}>${o}</option>`).join("")}</select></label>`).join("")}</div>`:""}</div>`}).join("");
const a=tot("a"),b=tot("b"),df=b-a,m=Math.max(a,b),p=m?Math.abs(df)/m*100:0,v=$("res");
$("ta").textContent=fmt(a);$("tb").textContent=fmt(b);
const maxAng = 3.5; 
$("bm").style.setProperty("--ang",(m?Math.max(-maxAng,Math.min(maxAng,(b-a)/m*(maxAng*2))):0)+"deg");
if(!m){v.textContent=tr("empty");v.className="vd"}
else if(p<=5){v.textContent=tr("eq")+fmt(Math.abs(df))+")";v.className="vd"}
else if(df>0){v.textContent=`${tr("plus")}${fmt(df)} (${p.toFixed(0)}%)`;v.className="vd ok"}
else{v.textContent=`${tr("minus")}${fmt(-df)} (${p.toFixed(0)}%)`;v.className="vd bad"}
$("grid").dataset.tab=TAB;for(const k of["a","b"]){const bt=$("tb"+k);bt.textContent=tr(k==="a"?"ha":"hb")+" ("+side[k].length+")";bt.classList.toggle("on",TAB===k);if(!side[k].length)$("l"+k).innerHTML=`<div class="empty">${tr("hint")}</div>`}
lsSet("aa_cur",JSON.stringify({a:pk(side.a),b:pk(side.b)}))}
const lb=a=>a.map(x=>esc(x.n)+(x.q>1?" ×"+x.q:"")).join(", ")||"—";

function hist(){$("hl").innerHTML=H.length?H.map((h,j)=>{const d=h.tb-h.ta;return `<div class="row"><div class="top"><span class="mu">${new Date(h.t).toLocaleString(L==="en"?"en-GB":LOC[L])}</span><span><button class="btn g" data-a="ld" data-j="${j}">${tr("load")}</button><button class="x" data-a="dl" data-j="${j}">×</button></span></div><div>${tr("gave")}: ${lb(h.a)} <b>(${fmt(h.ta)})</b></div><div>${tr("got")}: ${lb(h.b)} <b>(${fmt(h.tb)})</b></div><div class="${d>0?"ok":d<0?"bad":""}"><b>${d>0?"+":d<0?"−":""}${fmt(Math.abs(d))}</b></div></div>`}).join(""):`<div class="mu">${tr("noh")}</div>`}
const FS=[["all","f_all"],["unit","f_unit"],["skin","f_skin"],["relic","f_relic"],["pass","f_pass"]];
const fbar=()=>{$("fb").innerHTML=FS.map(([f,k])=>`<button class="chipb${F===f?" on":""}" data-a="f" data-f="${f}">${tr(k)}</button>`).join("")};
const txt=()=>{const f=k=>side[k].map(r=>ALL[r.i].n+(sx(r)?` [+${sx(r)}]`:"")+(r.q>1?" ×"+r.q:"")).join(", ")||"—";return `${tr("gave")}: ${f("a")} (${fmt(tot("a"))})\n${tr("got")}: ${f("b")} (${fmt(tot("b"))})\n${$("res").textContent}`};
const copy=async s=>{try{await navigator.clipboard.writeText(s);return 1}catch(e){try{const x=document.createElement("textarea");x.value=s;document.body.appendChild(x);x.select();const ok=document.execCommand("copy");x.remove();return ok}catch(e2){return 0}}};
const flash=(el,m)=>{const o=el.innerHTML;el.textContent=m;setTimeout(()=>{el.innerHTML=o},1400)};

function updateView(v) {
    VIEW = v;
    lsSet("aa_view", v);
    $("nav-list").classList.toggle("on", v === "list");
    $("nav-calc").classList.toggle("on", v === "calc");
    $("view-list").style.display = v === "list" ? "block" : "none";
    $("view-calc").style.display = v === "calc" ? "block" : "none";
}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
if(a==="main"){
    updateView(t.dataset.v);
    return;
}
if(a==="tab"){TAB=t.dataset.t;lsSet("aa_tab",TAB);render();return}
if(a==="f"){F=t.dataset.f;fbar();renderValueList();return}
if(a==="swap"){[side.a,side.b]=[side.b,side.a];render();return}
if(a==="clr"){side.a=[];side.b=[];render();return}
if(a==="save"){if(!side.a.length&&!side.b.length)return;H.unshift({t:Date.now(),a:pk(side.a),b:pk(side.b),ta:tot("a"),tb:tot("b")});H=H.slice(0,100);lsSet("aa_hist",JSON.stringify(H));hist();flash(t,tr("saved"));return}
if(a==="copy"){copy(txt()).then(ok=>flash(t,ok?"✓":"✗"));return}
if(a==="hclr"){H=[];lsSet("aa_hist","[]");hist();return}
if(a===dl){H.splice(+t.dataset.j,1);lsSet("aa_hist",JSON.stringify(H));hist();return}
if(a==="ld"){const h=H[+t.dataset.j];side.a=un(h.a);side.b=un(h.b);render();window.scrollTo(0,0);return}
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(a==="m")r.q=Math.max(1,r.q-1);else if(a==="p")r.q++;else if(a==="t")r.o=!r.o;else if(a==="x")side[t.dataset.k].splice(+t.dataset.j,1);
render()});
document.addEventListener("change",e=>{const t=e.target;
if(t.id==="lg"){lsSet("aa_lang",t.value);setLang(t.value);return}
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(t.dataset.a==="q")r.q=Math.max(1,parseInt(t.value)||1);else if(t.dataset.s)r.s[t.dataset.s]=+t.value;
render()});
for(const k of["a","b"]){const inp=$("s"+k),dd=$("d"+k);
const list=()=>{const q=inp.value.trim().toLowerCase();
    return ALL.map((x,i)=>i).filter(i=>match(ALL[i])&&(!q||ALL[i].n.toLowerCase().includes(q)))
};
const show=()=>{dd.innerHTML=list().map(i=>`<div data-i="${i}" style="--tc:${TC(ALL[i])}">${tag(ALL[i])}<span class="dn">${esc(ALL[i].n)}<br><span class="mu" style="color:${dc(ALL[i].d)}">${tr("dem")} ${ALL[i].d}</span></span><b>${ALL[i].v<0?"?":fmt(ALL[i].v)}</b></div>`).join("")||`<div class="mu">${tr("none")}</div>`;dd.style.display="block"};
const add=i=>{side[k].push({i,q:1,s:{DMG:0,SPA:0,RNG:0},o:0});inp.value="";dd.style.display="none";render()};
inp.addEventListener("input",show);inp.addEventListener("focus",show);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=list();if(m.length)add(m[0])}});
inp.addEventListener("blur",()=>{setTimeout(()=>dd.style.display="none",150)});
dd.addEventListener("mousedown",e=>{const el=e.target.closest("[data-i]");if(!el)return;e.preventDefault();add(+el.dataset.i)})}
function setLang(l){L=l;document.documentElement.lang=l;$("lg").value=l;
$("nav-list").textContent=tr("nav_list");$("nav-calc").textContent=tr("nav_calc");$("list-q").placeholder=tr("list_ph");
$("ha").textContent=$("bga").textContent=tr("ha");$("hb").textContent=$("bgb").textContent=tr("hb");
$("sa").placeholder=$("sb").placeholder=tr("ph");$("hh").textContent=tr("hh");$("hclr").textContent=tr("clr");
const IC={sw:'<path d="M7 7h12m0 0-3-3m3 3-3 3M17 17H5m0 0 3-3m-3 3 3 3"/>',sv:'<path d="M6 4h12v16l-6-4-6 4z"/>',cp:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',rs:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>'};
const ib=(k,i)=>`<span class="ic"><svg viewBox="0 0 24 24">${IC[i]}</svg></span><span class="lb">${tr(k)}</span>`;$("sw").innerHTML=ib("swap","sw");$("sv").innerHTML=ib("save","sv");$("cp").innerHTML=ib("copy","cp");$("rs").innerHTML=ib("reset","rs");
[["sw","swap"],["sv","save"],["cp","copy"],["rs","reset"]].forEach(([i,k])=>$(i).setAttribute("aria-label",tr(k)));
$("src").innerHTML=tr("src")+' <a href="https://docs.google.com/spreadsheets/d/1KTVAqVw26TkwJF7GGJmKjkVEXCK5itqS1OZAIpqxuJ0/htmlview?gid=883691415" target="_blank" rel="noopener">'+tr("lnk")+'</a>';
fbar();render();hist();renderValueList();}
const dl=()=>{for(const x of(navigator.languages||[navigator.language])){const c=(x||"").slice(0,2).toLowerCase();if(T[c])return c}return"en"};
{const l=lsGet("aa_lang",null);setLang(T[l]?l:dl());updateView(VIEW);}
</script></body></html>
