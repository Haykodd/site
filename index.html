<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AA Value Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: manga-panel board. Ink outlines, hard offset shadows, halftone paper.
   One loud moment: the balance scale with rolling digits. Everything else stays quiet and tactile (press-down buttons). */
:root{
  --paper:#eef0f9;--dot:rgba(24,22,51,.10);--sf:#ffffff;--sf2:#e3e6f5;--tx:#181633;--mu:#575c84;
  --line:#181633;--shadow:#181633;--ln:rgba(24,22,51,.22);--on:#181633;
  --gb:#ffcf3f;--give:#ff6377;--get:#22d49b;--ok:#0b8a61;--bad:#c72a43;
  --r0:#aab0cf;--r1:#4cbcff;--r2:#a878ff;--r3:#ffcf3f;--r4:#ff8a3d;--r5:#ff5fa8;--rx:#2ed3c4;
  color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13122a;--dot:rgba(255,255,255,.07);--sf:#1f1d3e;--sf2:#2d2b55;--tx:#f1efff;--mu:#a3a2cf;
  --line:#ebe8ff;--shadow:#05040f;--ln:rgba(255,255,255,.2);--ok:#5fe8b4;--bad:#ff8c9d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13122a;--dot:rgba(255,255,255,.07);--sf:#1f1d3e;--sf2:#2d2b55;--tx:#f1efff;--mu:#a3a2cf;
  --line:#ebe8ff;--shadow:#05040f;--ln:rgba(255,255,255,.2);--ok:#5fe8b4;--bad:#ff8c9d;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.5px);background-size:16px 16px;color:var(--tx);
  font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:980px;margin:auto;--stick:calc(env(safe-area-inset-top,0px) + 8px)}
a{color:var(--tx);font-weight:600}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.mu{color:var(--mu);font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}

/* header */
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hd{margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;margin:0;font:400 23px/1 "Dela Gothic One",Onest,system-ui,sans-serif}
.brand .mk{flex:none;width:46px;height:46px;border:2px solid var(--line);border-radius:13px;background:var(--gb);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;color:var(--on);transform:rotate(-4deg);animation:wob 1s .35s cubic-bezier(.3,1.4,.5,1) both}
.brand .mk svg{width:26px;height:26px}
.brand small{display:block;margin-top:5px;font:600 12.5px/1 Onest,system-ui,sans-serif;color:var(--mu)}
@keyframes wob{0%{transform:rotate(-4deg)}35%{transform:rotate(-22deg)}70%{transform:rotate(8deg)}100%{transform:rotate(-4deg)}}
.hdr-r{display:flex;gap:10px;align-items:center}

/* controls */
select,input{font:inherit;font-size:16px;color:var(--tx);background:var(--sf);border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;transition:box-shadow .15s,transform .15s}
input::placeholder{color:var(--mu)}
input:focus,select:focus-visible{box-shadow:3px 3px 0 var(--gb);transform:translate(-1px,-1px)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
select{appearance:none;-webkit-appearance:none;font-size:14px;font-weight:600;padding:9px 32px 9px 12px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx) 50%),linear-gradient(135deg,var(--tx) 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.btn{border:2px solid var(--line);background:var(--gb);color:var(--on);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;
  box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s,background-color .2s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.g{background:var(--sf);color:var(--tx)}
.ic-b{width:40px;height:40px;padding:0;display:grid;place-items:center}
.ic-b svg,.ic svg{display:block;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* segmented tabs with a sliding thumb */
.seg{position:relative;display:flex;border:2px solid var(--line);border-radius:15px;background:var(--sf);padding:3px;box-shadow:3px 3px 0 var(--shadow)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/2);border:2px solid var(--line);border-radius:11px;background:var(--gb);
  transform:translateX(calc(var(--pos,0)*100%));transition:transform .5s cubic-bezier(.3,1.35,.5,1),background-color .3s}
.seg[data-pos="1"]{--pos:1}
.seg button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--tx);font-weight:700;font-size:14px;padding:10px 8px;border-radius:11px;transition:color .2s}
.seg button.on{color:var(--on)}
.seg.main{position:sticky;top:var(--stick);z-index:25;margin-bottom:14px}
.seg.ab{display:none;margin-bottom:12px}
.seg.ab .thumb{background:var(--give)}.seg.ab[data-pos="1"] .thumb{background:var(--get)}
.seg button.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* filters */
.fb{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 7px;margin:0 -4px 6px;scrollbar-width:none}.fb::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--sf);color:var(--tx);padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .12s,box-shadow .12s,background-color .2s}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:var(--gb);color:var(--on);box-shadow:2px 2px 0 var(--shadow)}

/* search */
.lsrow{display:flex;gap:10px;align-items:stretch;margin:6px 0 18px}
.sr{position:relative;flex:1;min-width:0}
.sr input{width:100%;padding:12px 14px}
.lsrow .sr input{padding-left:44px}
.sr svg.si{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.lsrow select{flex:none;max-width:44%}
.dd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:12;background:var(--sf);border:2px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);max-height:min(340px,42vh);overflow:auto;display:none}
.dd[style*="display: block"]{animation:drop .22s cubic-bezier(.3,1.3,.5,1)}
.dd>div{padding:8px 12px;min-height:48px;cursor:pointer;display:flex;align-items:center;gap:10px;border-top:2px dashed var(--ln)}
.dd>div:first-child{border-top:0}.dd>div:hover{background:var(--sf2)}
.dd .dn{flex:1;min-width:0;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.dd b{font:400 14px "Dela Gothic One",Onest,sans-serif}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* sticker bits */
.tag{flex:none;min-width:40px;text-align:center;padding:4px 7px 3px;border:2px solid var(--line);border-radius:9px;background:var(--tc);color:var(--on);font:400 12px/1.2 "Dela Gothic One",Onest,sans-serif}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px}
.dem{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dm{width:46px;height:10px;border:2px solid var(--line);border-radius:99px;background:var(--sf2);overflow:hidden}
.dm i{display:block;height:100%;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
.tg{padding:2px 9px;border:2px solid var(--line);border-radius:99px;font-weight:700;font-size:11.5px;background:var(--sf2);color:var(--tx)}
.tg.tH{background:var(--gb);color:var(--on)}.tg.tU{background:var(--give);color:var(--on)}.tg.tO{background:var(--r5);color:var(--on)}
.nm{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.pr{flex:none;font:400 17px/1.2 "Dela Gothic One",Onest,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.ci-head{display:flex;gap:10px;align-items:flex-start}

/* value list */
#list-content.anim .list-item{animation:cardIn .55s cubic-bezier(.2,1.15,.3,1) both;animation-delay:calc(var(--i,0)*30ms)}
.tier-group{margin-bottom:24px}
.rib{position:sticky;top:calc(var(--stick) + 60px);z-index:5;display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:6px 0;background:var(--paper);box-shadow:0 -8px 0 var(--paper)}
.rib .tag{font-size:15px;padding:5px 11px 4px}
.rib .cnt{font-weight:700;font-size:13px;color:var(--mu)}
.rib .ln{flex:1;height:0;border-top:2px dashed var(--ln)}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.list-item{position:relative;overflow:hidden;min-width:0;background:var(--sf);border:2px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);padding:12px;display:flex;flex-direction:column;gap:9px;transition:transform .18s,box-shadow .18s}
.list-item:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.add{display:flex;gap:8px;margin-top:auto;padding-top:2px}
.add .btn{flex:1;padding:7px 8px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--shadow)}
.add .give{background:var(--give);color:var(--on)}.add .get{background:var(--get);color:var(--on)}
.foil::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.7),transparent 48%),linear-gradient(115deg,transparent 18%,rgba(255,95,168,.55) 34%,rgba(255,207,63,.55) 50%,rgba(76,188,255,.55) 66%,transparent 82%)}
@media(hover:hover){.foil:hover::after{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) rotate(-1deg) scale(.97)}to{opacity:1;transform:none}}
#view-list,#view-calc{animation:viewIn .4s cubic-bezier(.2,1,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* calculator panels */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{background:var(--sf);border:2px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:14px;min-width:0}
.lab{display:inline-block;margin:-26px 0 12px;padding:5px 12px 4px;border:2px solid var(--line);border-radius:10px;font:400 14px/1.2 "Dela Gothic One",Onest,sans-serif;color:var(--on);transform:rotate(-2deg)}
.card.give .lab{background:var(--give)}.card.get .lab{background:var(--get)}
.card.give,.card.get{margin-top:12px}
.row{padding:13px 0;border-bottom:2px dashed var(--ln);display:flex;flex-direction:column;gap:8px}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row.new{animation:rowIn .5s cubic-bezier(.2,1.3,.3,1)}
@keyframes rowIn{from{opacity:0;transform:translateX(-18px) scale(.96)}to{opacity:1;transform:none}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stp{display:inline-flex;align-items:center;height:38px;border:2px solid var(--line);border-radius:11px;overflow:hidden;background:var(--sf)}
.stp button{border:0;background:none;color:var(--tx);width:38px;height:100%;font-size:19px;font-weight:700;display:grid;place-items:center;transition:background-color .15s}
.stp button:hover{background:var(--sf2)}
.stp input{width:46px;height:100%;border:0;border-radius:0;background:none;text-align:center;padding:0;font-size:15px;font-weight:700;box-shadow:none;transform:none}
.stp input:focus{background:var(--sf2);box-shadow:none;transform:none}
.ctl .btn.g{padding:6px 11px;font-size:13px;height:38px}
.x{margin-left:auto;width:34px;height:34px;border:2px solid var(--line);border-radius:50%;background:var(--sf);color:var(--tx);font-size:20px;line-height:1;padding:0;display:grid;place-items:center;transition:transform .2s,background-color .2s}
.x:hover{background:var(--give);color:var(--on);transform:rotate(90deg)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;animation:rowIn .3s both}
.sg label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:12px}
.sg select{width:100%;padding:8px 22px 8px 8px;background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%}
.empty{padding:22px 14px;text-align:center;color:var(--mu);font-weight:600;border:2px dashed var(--ln);border-radius:14px;animation:viewIn .4s both}

/* the scale */
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;margin-top:18px;padding:12px 14px;background:var(--sf);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow)}
.bal{display:grid;grid-template-columns:minmax(0,1fr) clamp(104px,30vw,210px) minmax(0,1fr);align-items:center;gap:8px}
.bal .s{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bal .s:last-child{align-items:flex-end}
.bal .s>span{font-weight:700;font-size:12px;color:var(--mu);border-bottom:3px solid var(--c);padding-bottom:1px}
.bal .s.give{--c:var(--give)}.bal .s.get{--c:var(--get)}
.odo{display:inline-flex;align-items:flex-start;font:400 clamp(16px,4.6vw,28px)/1.1 "Dela Gothic One",Onest,sans-serif;height:1.1em;margin:0}
.dg{display:inline-block;width:1em;height:1.1em;clip-path:inset(0 -.4em);text-align:center}
.st{display:block;line-height:1.1em;transform:translateY(calc(var(--d,0)*-1.1em));transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.sp{display:inline-block;width:.42em;height:1.1em;text-align:center}
.scale{position:relative;height:74px}
.beam{position:absolute;left:6%;right:6%;top:16px;height:6px;border-radius:3px;background:var(--line);transform:rotate(var(--ang,0deg));transition:transform 1s cubic-bezier(.34,1.7,.5,1)}
.pan{position:absolute;top:3px;width:36px;height:0;transform-origin:50% 0;transform:translateX(-50%) rotate(calc(var(--ang,0deg)*-1));transition:transform 1s cubic-bezier(.34,1.7,.5,1)}
.pan.l{left:0}.pan.r{left:100%}
.pan::before{content:"";position:absolute;left:50%;top:0;width:2px;height:26px;background:var(--line);transform:translateX(-50%)}
.pan i{position:absolute;left:0;top:26px;width:36px;height:15px;border:2px solid var(--line);border-radius:0 0 36px 36px}
.pan.l i{background:var(--give)}.pan.r i{background:var(--get)}
.fulcrum{position:absolute;left:50%;top:19px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:36px solid var(--line)}
.scale::after{content:"";position:absolute;left:50%;bottom:0;width:46px;height:8px;transform:translateX(-50%);background:var(--line);border-radius:4px}
.vd{display:block;width:fit-content;max-width:100%;margin:12px auto 0;padding:8px 18px;border:2px solid var(--line);border-radius:12px;background:var(--sf2);color:var(--tx);font-weight:700;font-size:14px;text-align:center;box-shadow:3px 3px 0 var(--shadow);transform:rotate(-1.5deg)}
.vd.ok{background:var(--get);color:var(--on)}.vd.bad{background:var(--give);color:var(--on)}.vd.eq{background:var(--gb);color:var(--on)}
.vd.pop{animation:stamp .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:rotate(-1.5deg) scale(1.7);opacity:0}55%{transform:rotate(-1.5deg) scale(.93);opacity:1}100%{transform:rotate(-1.5deg) scale(1)}}
.acts{display:flex;gap:10px;margin-top:14px}
.acts .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.acts #sv{flex:1}.acts .btn.g{width:48px;padding:0}.acts .lb{display:none}.acts #sv .lb{display:inline}

/* history */
.hist{margin-top:20px}
.hist .top{margin-bottom:12px}
.hist h2{margin:0;font:400 16px/1.2 "Dela Gothic One",Onest,sans-serif}
.hrow{border:2px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;background:var(--sf);display:flex;flex-direction:column;gap:4px;animation:rowIn .4s both}
.hrow:last-child{margin-bottom:0}
.hrow .top{margin:0}.hrow .hb{display:flex;gap:8px;align-items:center}
.hrow .btn.g{padding:5px 10px;font-size:12.5px;box-shadow:2px 2px 0 var(--shadow)}
.hrow .x{margin-left:0;width:30px;height:30px;font-size:18px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.src{text-align:center;margin:22px 0 4px}

.fly{position:fixed;z-index:60;width:28px;height:28px;border:2px solid var(--line);border-radius:50%;pointer-events:none;box-shadow:2px 2px 0 var(--shadow)}

@media(max-width:700px){
  .grid{grid-template-columns:1fr;gap:12px}.grid .lab{display:none}.card.give,.card.get{margin-top:0}
  .seg.ab{display:flex}
  .grid[data-tab="a"]>#pb,.grid[data-tab="b"]>#pa{display:none}
  .list-grid{grid-template-columns:1fr}
  .brand{font-size:20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<div class="wrap">
<header class="top hd">
  <h1 class="brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M4 8l8-2 8 2M4 8l-2 6a3 3 0 0 0 4 0zM20 8l-2 6a3 3 0 0 0 4 0z"/></svg></span><span>AA Value <small>Calculator</small></span></h1>
  <div class="hdr-r">
    <button class="btn g ic-b" data-a="theme" id="thm" aria-label="Theme" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <select id="lg" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option></select>
  </div>
</header>

<div class="seg main" id="segm" data-pos="0"><i class="thumb"></i>
  <button class="on" data-a="main" data-v="list" id="nav-list" type="button"></button>
  <button data-a="main" data-v="calc" id="nav-calc" type="button"></button>
</div>

<div class="fb" id="fb"></div>

<div id="view-list">
  <div class="lsrow">
    <div class="sr"><svg class="si" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input id="list-q" autocomplete="off"></div>
    <select id="srt" aria-label="Sort"></select>
  </div>
  <div id="list-content"></div>
</div>

<div id="view-calc" hidden>
  <div class="seg ab" id="segab" data-pos="0"><i class="thumb"></i>
    <button class="on" data-a="tab" data-t="a" id="tba" type="button"></button>
    <button data-a="tab" data-t="b" id="tbb" type="button"></button>
  </div>
  <div class="grid" id="grid" data-tab="a">
    <section class="card give" id="pa"><h2 class="lab" id="ha"></h2><div class="sr"><input id="sa" autocomplete="off"><div class="dd" id="da"></div></div><div id="la"></div></section>
    <section class="card get" id="pb"><h2 class="lab" id="hb"></h2><div class="sr"><input id="sb" autocomplete="off"><div class="dd" id="db"></div></div><div id="lb"></div></section>
  </div>
  <div class="bar">
    <div class="bal">
      <div class="s give"><span id="bga"></span><b class="odo" id="ta" role="img"></b></div>
      <div class="scale" id="scale" aria-hidden="true"><div class="beam"><span class="pan l"><i></i></span><span class="pan r"><i></i></span></div><u class="fulcrum"></u></div>
      <div class="s get"><span id="bgb"></span><b class="odo" id="tb" role="img"></b></div>

const CAT={uk:{Relic:"Реліквія","Rainbow skin":"Rainbow скін",Skin:"Скін",Gamepass:"Геймпас"},ru:{Relic:"Реликвия","Rainbow skin":"Rainbow скин",Skin:"Скин",Gamepass:"Геймпасс"}},LOC={en:"en-US",ru:"ru-RU",uk:"uk-UA"};
let L="en",F="all",TAB="a",VIEW="list",SORT="tier";const side={a:[],b:[]};
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tr=k=>T[L][k],cat=c=>(CAT[L]&&CAT[L][c])||c,fmt=n=>Math.round(n).toLocaleString(LOC[L]);
const RM=window.matchMedia("(prefers-reduced-motion: reduce)");
const sx=r=>ALL[r.i].u?Object.keys(ST).reduce((t,k)=>t+ST[k][r.s[k]],0):0;
const price=r=>{const i=ALL[r.i];return i.v<0?0:(i.v+sx(r))*r.q};
const tot=k=>side[k].reduce((s,r)=>s+price(r),0);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pk=a=>a.map(r=>({n:ALL[r.i].n,c:ALL[r.i].c,q:r.q,s:{...r.s}}));
const un=a=>(a||[]).map(x=>({i:ALL.findIndex(y=>y.n===x.n&&y.c===x.c),q:x.q||1,s:{DMG:0,SPA:0,RNG:0,...x.s},o:0})).filter(r=>r.i>=0);
let H=[];try{H=JSON.parse(lsGet("aa_hist","[]"))}catch(e){}
try{const cur=JSON.parse(lsGet("aa_cur","{}"));side.a=un(cur.a);side.b=un(cur.b)}catch(e){}
try{VIEW=lsGet("aa_view","list");TAB=lsGet("aa_tab","a");SORT=lsGet("aa_sort","tier");if(!["tier","value","demand"].includes(SORT))SORT="tier";if(VIEW!=="calc")VIEW="list";if(TAB!=="b")TAB="a"}catch(e){}

const match=it=>F==="all"||(F==="unit"&&it.u)||(F==="skin"&&/skin/i.test(it.c))||(F==="relic"&&it.c==="Relic")||(F==="pass"&&it.c==="Gamepass");
const TC=i=>!i.u?"var(--rx)":i.c==="SSS"?"var(--r5)":i.c==="SS"?"var(--r4)":/^S/.test(i.c)?"var(--r3)":/^A/.test(i.c)?"var(--r2)":/^B/.test(i.c)?"var(--r1)":"var(--r0)";
const tag=i=>`<span class="tag" style="--tc:${TC(i)}">${esc(i.u?i.c:cat(i.c))}</span>`;
const dc=d=>`hsl(${Math.min(120,Math.max(0,(d-1)/8*120))},85%,52%)`;
const chips=i=>`<span class="dem"><span class="dm" aria-hidden="true"><i style="width:${Math.min(100,i.d/9*100)}%;background:${dc(i.d)}"></i></span>${tr("dem")} ${i.d}</span><span class="tg t${i.t||"S"}">${tr(i.t||"S")}</span>${i.v<0?`<span class="tg tO">${tr("neg")}</span>`:""}`;
const isFoil=i=>i.c==="SSS"||i.c==="SS"||i.c==="S+"||i.c==="Rainbow skin";

/* odometer: each digit is a strip of 0-9 that slides to its value */
function setOdo(el,n){
  const str=fmt(n),pat=str.replace(/\d/g,"#"),digits=[...str].filter(c=>/\d/.test(c));
  el.setAttribute("aria-label",str);
  const apply=()=>el.querySelectorAll(".st").forEach((c,k)=>c.style.setProperty("--d",digits[k]));
  if(el._p!==pat){
    el._p=pat;
    el.innerHTML=[...str].map(ch=>/\d/.test(ch)?`<span class="dg" aria-hidden="true"><span class="st" style="--d:0">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</span></span>`:`<span class="sp" aria-hidden="true">${ch}</span>`).join("");
    requestAnimationFrame(()=>requestAnimationFrame(apply));
  }else apply();
}
const pop=el=>{el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")};
function bump(){const b=$("nav-calc");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function fly(from,color){
  if(RM.matches||!from.animate){bump();return}
  const a=from.getBoundingClientRect(),b=$("nav-calc").getBoundingClientRect();
  const d=document.createElement("div");d.className="fly";d.style.background=color;
  d.style.left=(a.left+a.width/2-14)+"px";d.style.top=(a.top+a.height/2-14)+"px";document.body.appendChild(d);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  const an=d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx*.45}px,${dy*.45-70}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.4)`,opacity:.3}],{duration:640,easing:"cubic-bezier(.4,0,.2,1)"});
  an.onfinish=()=>{d.remove();bump()};an.oncancel=()=>d.remove();
}

function renderValueList(anim){
  const q=$("list-q").value.trim().toLowerCase();
  const tierOrder=["SSS","SS","S+","S","S-","A+","A","A-","B+","B","B-","C+","C","C-","Relic","Rainbow skin","Skin","Gamepass"];
  let groups=[];
  tierOrder.forEach(c=>{
    const td=D.find(d=>d[0]===c);if(!td)return;
    const items=td[2].split("\n").map(l=>{const [n,v,d,t,inf]=l.split(";");return {n,v:+v,d:+d,t:t||"",inf:inf||"",c,u:td[1]}})
      .filter(i=>match(i)&&(!q||i.n.toLowerCase().includes(q)||i.c.toLowerCase().includes(q)));
    if(items.length)groups.push([c,items]);
  });
  if(SORT!=="tier"){
    const val=i=>i.v<0?Infinity:i.v,cmp=(x,y)=>x===y?0:y>x?1:-1;
    const all=groups.flatMap(g=>g[1]);
    all.sort(SORT==="value"?(a,b)=>cmp(val(a),val(b))||cmp(a.d,b.d):(a,b)=>cmp(a.d,b.d)||cmp(val(a),val(b)));
    groups=[["",all]];
  }
  let html="",n=0;
  groups.forEach(([c,items])=>{
    const head=c?`<h2 class="rib"><span class="tag" style="--tc:${TC(items[0])}">${esc(items[0].u?c:cat(c))}</span><span class="cnt">${items.length}</span><span class="ln"></span></h2>`:"";
    html+=`<section class="tier-group">${head}<div class="list-grid">`;
    items.forEach(i=>{
      const k=IDX.get(i.c+"|"+i.n);
      html+=`<article class="list-item${isFoil(i)?" foil":""}" style="--i:${Math.min(n,14)}"><div class="ci-head">${tag(i)}<div class="nm">${esc(i.n)}</div><div class="pr">${i.v<0?"?":fmt(i.v)}</div></div><div class="meta">${chips(i)}</div>${i.inf?`<div class="mu">${esc(i.inf)}</div>`:""}<div class="add"><button type="button" class="btn give" data-a="addg" data-i="${k}">${tr("add_give")}</button><button type="button" class="btn get" data-a="addr" data-i="${k}">${tr("add_get")}</button></div></article>`;
      n++;
    });
    html+=`</div></section>`;
  });
  const lc=$("list-content");lc.classList.toggle("anim",!!anim);
  lc.innerHTML=html||`<div class="empty">${tr("none")}</div>`;
}
$("list-q").addEventListener("input",()=>renderValueList());
$("list-content").addEventListener("pointermove",e=>{const c=e.target.closest(".foil");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");c.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")});

function render(){
  for(const k of["a","b"]){
    $("l"+k).innerHTML=side[k].map((r,j)=>{const i=ALL[r.i],s=sx(r),at=`data-k="${k}" data-j="${j}"`;
      return `<div class="row${r.n?" new":""}"><div class="ci-head">${tag(i)}<div class="nm">${esc(i.n)}</div><div class="pr">${fmt(price(r))}</div></div><div class="meta">${chips(i)}</div>${i.inf?`<div class="mu">${esc(i.inf)}</div>`:""}<div class="ctl"><span class="stp"><button type="button" ${at} data-a="m" aria-label="−">−</button><input type="number" min="1" inputmode="numeric" value="${r.q}" ${at} data-a="q" aria-label="×"><button type="button" ${at} data-a="p" aria-label="+">+</button></span>${i.u?`<button type="button" class="btn g" ${at} data-a="t">${tr("stats")}${s?" +"+fmt(s):""} ${r.o?"▴":"▾"}</button>`:""}<button type="button" class="x" ${at} data-a="x" aria-label="×">×</button></div>${i.u&&r.o?`<div class="sg">${Object.keys(ST).map(n=>`<label>${n} <select ${at} data-s="${n}">${SL.map((o,x)=>`<option value="${x}"${r.s[n]==x?" selected":""}>${o}</option>`).join("")}</select></label>`).join("")}</div>`:""}</div>`}).join("");
    side[k].forEach(r=>{delete r.n});
  }
  const a=tot("a"),b=tot("b"),df=b-a,m=Math.max(a,b),p=m?Math.abs(df)/m*100:0,v=$("res");
  setOdo($("ta"),a);setOdo($("tb"),b);
  $("scale").style.setProperty("--ang",(m?Math.max(-14,Math.min(14,(b-a)/m*28)):0)+"deg");
  let txt,cls;
  if(!m){txt=tr("empty");cls="vd"}
  else if(p<=5){txt=tr("eq")+fmt(Math.abs(df))+")";cls="vd eq"}
  else if(df>0){txt=`${tr("plus")}${fmt(df)} (${p.toFixed(0)}%)`;cls="vd ok"}
  else{txt=`${tr("minus")}${fmt(-df)} (${p.toFixed(0)}%)`;cls="vd bad"}
  const changed=v.textContent!==txt;v.textContent=txt;v.className=cls;if(changed&&m)pop(v);
  $("grid").dataset.tab=TAB;$("segab").dataset.pos=TAB==="a"?0:1;
  for(const k of["a","b"]){const bt=$("tb"+k);bt.textContent=tr(k==="a"?"ha":"hb")+" ("+side[k].length+")";bt.classList.toggle("on",TAB===k);if(!side[k].length)$("l"+k).innerHTML=`<div class="empty">${tr("hint")}</div>`}
  const c=side.a.length+side.b.length;$("nav-calc").textContent=tr("nav_calc")+(c?" · "+c:"");
  lsSet("aa_cur",JSON.stringify({a:pk(side.a),b:pk(side.b)}))}
const lb=a=>a.map(x=>esc(x.n)+(x.q>1?" ×"+x.q:"")).join(", ")||"—";

function hist(){$("hl").innerHTML=H.length?H.map((h,j)=>{const d=h.tb-h.ta;return `<div class="hrow"><div class="top"><span class="mu">${new Date(h.t).toLocaleString(L==="en"?"en-GB":LOC[L])}</span><span class="hb"><button type="button" class="btn g" data-a="ld" data-j="${j}">${tr("load")}</button><button type="button" class="x" data-a="dl" data-j="${j}" aria-label="×">×</button></span></div><div>${tr("gave")}: ${lb(h.a)} <b>(${fmt(h.ta)})</b></div><div>${tr("got")}: ${lb(h.b)} <b>(${fmt(h.tb)})</b></div><div class="${d>0?"ok":d<0?"bad":""}"><b>${d>0?"+":d<0?"−":""}${fmt(Math.abs(d))}</b></div></div>`}).join(""):`<div class="mu">${tr("noh")}</div>`}
const FS=[["all","f_all"],["unit","f_unit"],["skin","f_skin"],["relic","f_relic"],["pass","f_pass"]];
const fbar=()=>{$("fb").innerHTML=FS.map(([f,k])=>`<button type="button" class="chip${F===f?" on":""}" data-a="f" data-f="${f}">${tr(k)}</button>`).join("")};
const txt=()=>{const f=k=>side[k].map(r=>ALL[r.i].n+(sx(r)?` [+${sx(r)}]`:"")+(r.q>1?" ×"+r.q:"")).join(", ")||"—";return `${tr("gave")}: ${f("a")} (${fmt(tot("a"))})\n${tr("got")}: ${f("b")} (${fmt(tot("b"))})\n${$("res").textContent}`};
const copy=async s=>{try{await navigator.clipboard.writeText(s);return 1}catch(e){try{const x=document.createElement("textarea");x.value=s;document.body.appendChild(x);x.select();const ok=document.execCommand("copy");x.remove();return ok}catch(e2){return 0}}};
const flash=(el,m)=>{const o=el.innerHTML;el.textContent=m;setTimeout(()=>{el.innerHTML=o},1400)};

function updateView(v){
  VIEW=v;lsSet("aa_view",v);
  $("nav-list").classList.toggle("on",v==="list");$("nav-calc").classList.toggle("on",v==="calc");
  $("segm").dataset.pos=v==="calc"?1:0;
  $("view-list").hidden=v!=="list";$("view-calc").hidden=v!=="calc";
  $("fb").hidden=false;
}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
if(a==="main"){updateView(t.dataset.v);return}
if(a==="theme"){toggleTheme();return}
if(a==="tab"){TAB=t.dataset.t;lsSet("aa_tab",TAB);render();return}
if(a==="f"){F=t.dataset.f;fbar();renderValueList(true);return}
if(a==="swap"){[side.a,side.b]=[side.b,side.a];render();return}
if(a==="clr"){side.a=[];side.b=[];render();return}
if(a==="save"){if(!side.a.length&&!side.b.length)return;H.unshift({t:Date.now(),a:pk(side.a),b:pk(side.b),ta:tot("a"),tb:tot("b")});H=H.slice(0,100);lsSet("aa_hist",JSON.stringify(H));hist();flash(t,tr("saved"));return}
if(a==="copy"){copy(txt()).then(ok=>flash(t,ok?"✓":"✗"));return}
if(a==="hclr"){H=[];lsSet("aa_hist","[]");hist();return}
if(a==="dl"){H.splice(+t.dataset.j,1);lsSet("aa_hist",JSON.stringify(H));hist();return}
if(a==="ld"){const h=H[+t.dataset.j];side.a=un(h.a);side.b=un(h.b);render();window.scrollTo(0,0);return}
if(a==="addg"||a==="addr"){const k=a==="addg"?"a":"b";side[k].push({i:+t.dataset.i,q:1,s:{DMG:0,SPA:0,RNG:0},o:0,n:1});render();fly(t,k==="a"?"var(--give)":"var(--get)");flash(t,"✓");return}
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(a==="m")r.q=Math.max(1,r.q-1);else if(a==="p")r.q++;else if(a==="t")r.o=!r.o;else if(a==="x")side[t.dataset.k].splice(+t.dataset.j,1);
render()});
document.addEventListener("change",e=>{const t=e.target;
if(t.id==="lg"){lsSet("aa_lang",t.value);setLang(t.value);return}
if(t.id==="srt"){SORT=t.value;lsSet("aa_sort",SORT);renderValueList(true);return}
const r=side[t.dataset.k]&&side[t.dataset.k][+t.dataset.j];if(!r)return;
if(t.dataset.a==="q")r.q=Math.max(1,parseInt(t.value)||1);else if(t.dataset.s)r.s[t.dataset.s]=+t.value;
render()});
for(const k of["a","b"]){const inp=$("s"+k),dd=$("d"+k);
const list=()=>{const q=inp.value.trim().toLowerCase();return ALL.map((x,i)=>i).filter(i=>match(ALL[i])&&(!q||ALL[i].n.toLowerCase().includes(q)))};
const show=()=>{dd.innerHTML=list().map(i=>`<div data-i="${i}">${tag(ALL[i])}<span class="dn">${esc(ALL[i].n)}<br><span class="mu">${tr("dem")} ${ALL[i].d}</span></span><b>${ALL[i].v<0?"?":fmt(ALL[i].v)}</b></div>`).join("")||`<div class="mu">${tr("none")}</div>`;dd.style.display="block"};
const add=i=>{side[k].push({i,q:1,s:{DMG:0,SPA:0,RNG:0},o:0,n:1});inp.value="";dd.style.display="none";render()};
inp.addEventListener("input",show);inp.addEventListener("focus",show);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=list();if(m.length)add(m[0])}});
inp.addEventListener("blur",()=>{setTimeout(()=>dd.style.display="none",150)});
dd.addEventListener("mousedown",e=>{const el=e.target.closest("[data-i]");if(!el)return;e.preventDefault();add(+el.dataset.i)})}

$("nav-list").textContent=tr("nav_list");$("nav-calc").textContent=tr("nav_calc");$("list-q").placeholder=tr("list_ph");
$("ha").textContent=$("bga").textContent=tr("ha");$("hb").textContent=$("bgb").textContent=tr("hb");
$("sa").placeholder=$("sb").placeholder=tr("ph");$("hh").textContent=tr("hh");$("hclr").textContent=tr("clr");

const ib=(k,i)=>`<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[i]}</svg></span><span class="lb">${tr(k)}</span>`;$("sw").innerHTML=ib("swap","sw");$("sv").innerHTML=ib("save","sv");$("cp").innerHTML=ib("copy","cp");$("rs").innerHTML=ib("reset","rs");
[["sw","swap"],["sv","save"],["cp","copy"],["rs","reset"]].forEach(([i,k])=>$(i).setAttribute("aria-label",tr(k)));
$("src").innerHTML=tr("src")+' <a href="https://docs.google.com/spreadsheets/d/1KTVAqVw26TkwJF7GGJmKjkVEXCK5itqS1OZAIpqxuJ0/htmlview?gid=883691415" target="_blank" rel="noopener">'+tr("lnk")+'</a>';
$("srt").innerHTML=[["tier","sort_tier"],["value","sort_val"],["demand","sort_dem"]].map(([v,k])=>`<option value="${v}"${SORT===v?" selected":""}>${tr(k)}</option>`).join("");$("thm").setAttribute("aria-label",tr("theme"));
fbar();render();hist();renderValueList(true)}
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function toggleTheme(){const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;lsSet("aa_theme",n)}
{const th=lsGet("aa_theme",null);if(th==="dark"||th==="light")document.documentElement.dataset.theme=th}
const dl=()=>{for(const x of(navigator.languages||[navigator.language])){const c=(x||"").slice(0,2).toLowerCase();if(T[c])return c}return"en"};
{const l=lsGet("aa_lang",null);setLang(T[l]?l:dl());updateView(VIEW)}
