function render(){let tot={};for(const k of["a","b"]){
$("l"+k).innerHTML=side[k].map((r,j)=>{const i=ALL[r.i];
const st=i.u?Object.keys(ST).map(s=>`<label class="mu">${s} <select data-k="${k}" data-j="${j}" data-s="${s}">${SL.map((o,x)=>`<option value="${x}"${r.s[s]==x?" selected":""}>${o}</option>`).join("")}</select></label>`).join(""):"";
return `<div class="row"><div class="top"><div>${esc(i.n)}<div class="mu">${cat(i.c)}${i.t?" · "+tr(i.t):""} · ${tr("dem")} ${i.d}${i.v<0?" · "+tr("neg"):""}</div></div><div><b>${fmt(price(r))}</b> <button class="x" data-k="${k}" data-j="${j}" data-rm="1">×</button></div></div><div class="ctl">${st}<label class="mu">${tr("qty")} <input class="q" type="number" min="1" value="${r.q}" data-k="${k}" data-j="${j}" data-q="1"></label></div></div>`}).join("");

if(!m){r.textContent=tr("empty");r.className="card res";return}
const p=Math.abs(d)/m*100;
if(p<=5){r.textContent=tr("eq")+fmt(Math.abs(d))+")";r.className="card res"}
else if(d>0){r.textContent=`${tr("plus")}${fmt(d)} (${p.toFixed(0)}%)`;r.className="card res ok"}

dd.addEventListener("mousedown",e=>{const el=e.target.closest("[data-i]");if(!el)return;e.preventDefault();
side[k].push({i:+el.dataset.i,q:1,s:{DMG:0,SPA:0,RNG:0}});inp.value="";dd.style.display="none";render()});
inp.addEventListener("blur",()=>dd.style.display="none");
